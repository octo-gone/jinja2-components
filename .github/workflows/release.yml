name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release Draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Extract project version from pyproject.toml
        run: |
          PROJECT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV

      - name: Check if tag version matches project version
        run: |
          TAG=$(git describe HEAD --tags --abbrev=0)
          echo "Tag: $TAG"
          echo "Project version: $PROJECT_VERSION"
          if [[ "$TAG" != "v$PROJECT_VERSION" ]]; then exit 1; fi

      - name: Install dependencies (including dev)
        run: uv sync --group dev

      - name: Build package
        run: uv build

      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/jinja2_components-${{env.PROJECT_VERSION}}-py3-none-any.whl
            dist/jinja2_components-${{env.PROJECT_VERSION}}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}