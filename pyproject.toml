[project]
name = "jinja2-components"
version = "1.0.0"
description = "Streamlined way to build and reuse your Jinja2 templates from code"
readme = "README.md"
authors = [{ name = "octo-gone", email = "nklimin007@gmail.com" }]
urls = { repository = "https://github.com/octo-gone/jinja2-components", homepage = "https://github.com/octo-gone/jinja2-components" }
requires-python = ">=3.8"
dependencies = ["jinja2>=2.10"]

[dependency-groups]
dev = [
    "coverage>=7.6.1",
    "isort>=5.13.2",
    "mypy>=1.14.1",
    "pre-commit>=3.5.0",
    "pylint>=3.2.7",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
omit = ["tests/*"]
command_line = "-m unittest discover -s tests/"
[tool.coverage.report]
exclude_also = ["if t.TYPE_CHECKING:"]

# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
python_version = "3.10"

# https://pylint.readthedocs.io/en/stable/user_guide/configuration/all-options.html
[tool.pylint.main]
load-plugins = "pylint.extensions.docparams"
init-hook = 'import sys; sys.path.append(".")'
disable = []
ignore-paths = "^tests/.*$"
[tool.pylint.format]
max-line-length = 120

# https://docs.astral.sh/ruff/settings
[tool.ruff]
line-length = 120

# https://github.com/PyCQA/isort/blob/main/docs/configuration/options.md
[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
